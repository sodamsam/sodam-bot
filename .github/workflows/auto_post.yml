name: 매일 자동 글 발행

on:
  schedule:
    # KST 아침 7~8시 = UTC 22시(전날), 20분 간격으로 확인
    - cron: "0,20,40 22 * * *"
    # KST 저녁 19~20시 = UTC 10시, 20분 간격으로 확인
    - cron: "0,20,40 10 * * *"
  workflow_dispatch:
    inputs:
      force_window:
        description: "비워두면 평소처럼 랜덤 목표 시각 판단, 값을 넣으면 즉시 강제 발행"
        required: false
        type: choice
        options:
          - ""
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 자동 발행 실행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          FORCE_WINDOW: ${{ inputs.force_window }}
        run: python auto_post.py

      - name: 발행 기록 저장
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "봇: 발행 기록 업데이트"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
