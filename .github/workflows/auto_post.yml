name: 매일 자동 글 발행

on:
  schedule:
    # 외부 호출(cron-job.org)이 끊겨도 발행되도록 두는 보조 스케줄. GitHub은 정각 근처를 특히 늦게 돌려서 어긋난 분(分)을 쓴다.
    # 아침: KST 07~12시 = UTC 22~23시(전날) + 00~03시(당일)
    - cron: "7,27,47 22,23,0,1,2,3 * * *"
    # 저녁: KST 18~22시 = UTC 09~13시
    - cron: "7,27,47 9,10,11,12,13 * * *"
  workflow_dispatch:
    inputs:
      force_window:
        description: "비워두면 평소처럼 시간대 범위 판단, force를 넣으면 시간 판단 없이 즉시 발행"
        required: false
        type: choice
        options:
          - ""
          - force
      post_type:
        description: "비워두면 평소처럼 자동 판단. 아침 글(open/lead/briefing) 또는 저녁 코너(card_prompt/term/mistake/tip/engage)를 지정하면 그 글로 강제 발행(테스트용)"
        required: false
        type: choice
        options:
          - ""
          - open
          - lead
          - briefing
          - card_prompt
          - term
          - mistake
          - tip
          - engage
      dry_run:
        description: "yes로 두면 스레드에 올리지 않고 만들어진 글·카드만 previews 폴더에 저장 (결과 미리 확인용)"
        required: false
        type: choice
        options:
          - ""
          - "yes"

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 자동 발행 실행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FORCE_WINDOW: ${{ inputs.force_window }}
          POST_TYPE: ${{ inputs.post_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python auto_post.py

      - name: 발행 기록 저장
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "yes" ]; then
            # 미리보기 실행: 만들어진 글·카드만 남기고 발행 기록은 건드리지 않는다
            if [ -d previews ]; then git add previews/; fi
            if ! git diff --cached --quiet; then
              git commit -m "봇: 미리보기 저장"
              git checkout -- . || true   # 미리보기 중 바뀐 다른 파일(문구 로테이션 기록 등)은 버린다
              git pull --rebase origin ${{ github.ref_name }} || true
              git push
            fi
            exit 0
          fi
          for f in state/posted.json state/last_cta.json data/posted_log.csv docs/글감_발행목록.md; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if [ -d cards ]; then
            git add cards/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "봇: 발행 기록 업데이트"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
